# This rule is not used by the project messaging-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to messaging.thesis.local resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: messaging-operator
    app.kubernetes.io/managed-by: kustomize
  name: microservicemessagingprofile-viewer-role
rules:
- apiGroups:
  - messaging.thesis.local
  resources:
  - microservicemessagingprofiles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - messaging.thesis.local
  resources:
  - microservicemessagingprofiles/status
  verbs:
  - get
