# Multi-node kind cluster for the RabbitMQ HA thesis.
#
# Three workers is the minimum that makes the Raft demonstration honest:
# a quorum queue with replica factor 3 places one replica per worker, so
# `docker stop diplomski-ha-worker2` removes exactly one Raft voter and the
# remaining two still form a majority (2 of 3) and elect a new leader.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: diplomski-ha
nodes:
  - role: control-plane
    # Ingress-ready labels + host port mappings so the RabbitMQ management UI
    # can be reached from the host during the defense demo.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30672   # NodePort -> RabbitMQ management UI (15672)
        hostPort: 15672
        protocol: TCP
      - containerPort: 30567   # NodePort -> AMQP (5672)
        hostPort: 5672
        protocol: TCP
  - role: worker
    labels:
      thesis.local/rabbitmq: "true"
  - role: worker
    labels:
      thesis.local/rabbitmq: "true"
  - role: worker
    labels:
      thesis.local/rabbitmq: "true"
